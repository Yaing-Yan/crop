// ROM 例程标签表 —— 每行：name = <参考地址(verF)> | <指令签名，用 ; 分隔>  # 描述
// 地址只作"先试这里"的提示；真正使用前会在目标 ROM 里
//   ① 先在提示地址验证签名，② 失败则全 ROM 按签名扫描。
// 因此换 Ver 不需要改这里。签名里的 "xxx *" 表示只比指令形态（忽略随 Ver 变化的跳转目标）。

print-line = 221BE | ST R0, 0D137h ; BL * ; POP PC// 显示一行文本（r0=字体大小,r1=行,er2=文本地址）
refresh    = 08772 | PUSH XR4 ; PUSH QR8 ; MOV R0, #212 ; MOV R1, #221// 屏幕缓冲区 DDD4 → 显存
clear      = 07F6C | PUSH QR8 ; MOV ER8, #0 ; MOV ER10, #0 ; MOV ER12, #0// 清空屏幕缓冲区 DDD4
// 开启屏幕显示（不调用它的话，往屏幕缓冲区画什么都不显示）
screen-on = 0937C | MOV ER0, #4 ; ST R0, 0F030h ; MOV R0, #3
pop-er0        = 121A8 | POP ER0 ; POP PC   // 赋值 ER0
pop-er2        = 18814 | POP ER2 ; POP PC   // 赋值 ER2
pop-er4        = 1827C | POP ER4 ; POP PC   // 赋值 ER4
pop-er6        = 139EE | POP ER6 ; POP PC   // 赋值 ER6
pop-er8        = 0C0F0 | POP ER8 ; POP PC   // 赋值 ER8
pop-er10       = 0C29C | POP ER10 ; POP PC   // 赋值 ER10
pop-er12       = 21532 | POP ER12 ; POP PC   // 赋值 ER12
pop-er14       = 20D72 | POP ER14 ; POP PC   // 赋值 ER14
pop-xr0        = 16134 | POP XR0 ; POP PC   // 赋值 XR0
pop-xr4        = 16D78 | POP XR4 ; POP PC   // 赋值 XR4
pop-xr8        = 13846 | POP XR8 ; POP PC   // 赋值 XR8
pop-xr12       = 1D52C | POP XR12 ; POP PC   // 赋值 XR12
pop-qr0        = 130E2 | POP QR0 ; POP PC   // 赋值 QR0
pop-qr8        = 13236 | POP QR8 ; POP PC   // 赋值 QR8
pop-all        = 22390 | POP QR8 ; POP QR0 ; POP PC   // 赋值 QR8, QR0
rt-fix         = 2BAD4 | BL *   // 修复 RT 返回问题
byte-set       = 203D2 | ST R2, [ER0] ; POP PC   // 内存赋值 [ER0] = R2
mem-add        = 08F90 | L ER10, [ER8] ; ADD ER2, ER10 ; ST ER2, [ER8] ; POP XR8   // 内存地址加法 [ER8] += ER2
strcpy         = 203C8 | MOV ER2, ER2 ; BC EQ, 203D2h ; BL *   // 字符串复制 [ER2] -> [ER0] / 碰到00停止复制
refresh-ddd4   = 08772 | PUSH XR4 ; PUSH QR8 ; MOV R0, #212 ; MOV R1, #221   // 刷新DDD4屏幕缓冲区
clear-ddd4     = 07F6C | PUSH QR8 ; MOV ER8, #0 ; MOV ER10, #0 ; MOV ER12, #0   // 清除DDD4屏幕缓冲区
sleep          = 091D8 | MOV ER2, ER0 ; TB 0F00Ah.1 ; BC NE, 0924Ah ; BL *   // 延时 R1÷0x1E 秒
jump-e14       = 10740 | MOV SP, ER14 ; POP ER14 ; POP PC   // 重设SP为[ER14] / 注意会 POP ER14
jump-q8        = 12D34 | MOV SP, ER14 ; POP QR8 ; POP PC   // 重设SP为[ER14] / 注意会 POP QR8
jump-q8q0      = 2238E | MOV SP, ER14 ; POP QR8 ; POP QR0 ; POP PC   // 重设SP为[ER14] / 注意会 POP QR8、QR0
print-0x1y     = 0828A | PUSH LR ; PUSH QR8 ; MOV ER8, ER0 ; MOV ER10, ER2   // 打印一行文本内容（可变x轴偏移） / R0：x轴偏移 / R1：y轴偏移 / ER2：文本内容指针
print-0ynf     = 221AE | ADD R8, #1 ; CMP R8, #49 ; BC NE, 2215Eh ; ADD SP, #0Ah   // 打印一行文本内容（固定字体） / R0：y轴偏移 / ER2：文本内容指针
print-1ysf     = 222B4 | BL *   // 打印一行文本内容（字体随设置改变） / R1：y轴偏移 / ER2：文本内容指针
print-0f1y     = 221BE | ST R0, 0D137h ; BL *   // 打印一行文本内容（可变字体） / R0：字体编码 / R1：y轴偏移 / ER2：文本内容指针
debug          = 22110 | MOV R2, #238 ; MOV R3, #77 ; MOV R0, #49 ; BL *   // 屏幕显示Press AC后卡死 / 无需开屏幕，通常用于测试程序是否被执行
memcpy+jmp-x4q8 = 0CD8A | MOV ER2, ER0 ; BC AL, 0CD98h ; L R0, [ER10] ; ST R0, [ER12]   // 好用的memcpy，从er10复制长度er0的字节到er12同时跳到er14 / er10:复制起点 / er12:复制目标位置 / er0:长度 / sp=er14 / 注意POP XR4,QR8 / 污染er2
kill           = 40000 | MOV R0, #0 ; MOV R0, #0 ; MOV R0, #0 ; MOV R0, #0   // 卡死
print-r1       = 2236E | BL *   // 
wait_shift     = 221D0 | BL *   // 
render_bitmap  = 08B3C | PUSH XR4 ; PUSH QR8 ; ADD SP, #-04h ; MOV ER8, SP   // 
print-r1'      = 222DA | BL *   // r1-高度 / er2-地址
print-auto     = 221BE | ST R0, 0D137h ; BL *   // r0: 字体大小;r1: 高度;er2:地址 / r0:0E 正常字体;0A 小字体;08 表格小字体
blockdraw      = 08B2A | PUSH XR4 ; PUSH QR8 ; MOV R8, #255 ; MOV R9, #255   // 反色框，r0: 起始点x坐标  / r1: 起始点y坐标 / r2: x轴延伸长度  / r3: y轴延伸长度 / 还需提前将0xD138设置为0x03
switch-case    = 08F10 | L ER2, [EA+] ; BC EQ, 08F1Ah ; CMP ER2, ER0 ; BC NE, 08F10h   // 首先，我们需要一个键码-地址表 / 格式为 / 键码1 对应的跳转地址1 键码2 对应的跳转地址2 键码3 对应的跳转地址....键码n 对应的跳转地址n 0000 未识别到指定按键时的跳转地址 / 运行时需要将这个表复制到别处运行，或者找一个不会被PUSH污染的地址，程序终的时候和程序一起重置，因为执行时将会污染此表处地址 / 然后，检测按键，并将键码赋值到ER0，后面利用此进行按键分支 / 然后，把R6设为1，然后调用10E76，此地址在R6为1是会POP EA POP XR4返回，此时我们把EA设为复制到别处的表开头即可 / 调用08F10，此地址会遍历EA处内存，若遇到与ER0相同的地址，即我们识别的键码则将EA设置为此地址+2后返回，若遇到0000就将EA设置为此地址+2后强制将ER0设为0返回 / 然后调用1C368，此地址在此的主要作用是将EA处的内存读取至ER6，此地址后有一些在此程序中无用的ST和L指令，这就是需要备份表的原因 / 此时分两种情况： / 若识别到了指定键（不会有将地址识别成键码的情况，因为地址的第二个字节大于D0，不可能与某个键码相同），那么此时EA即为此键后面的跳转地址存放的地址，被复制到了ER6，此时ER6就是我们要跳转的地址 / 若未识别到指定键，那么此时EA即为0000后面的未识别到指定按键时的跳转地址存放的地址，也被复制到了ER6，此时ER6也是我们要跳转的地址 / 最后使用21D38跳转即可
pop-eaer4      = 10E76 | POP EA ; ADD R6, #255 ; BC NE, 10E68h ; POP XR4   // 
wait-press     = 0F7CA | PUSH LR ; BL *   // 等待按键->[er0]
[ea]toer6      = 1C368 | L ER6, [EA+] ; L QR8, [EA+] ; LEA 0D000h ; ST ER14, [EA+]   // EA处的内存读取至ER6， / qr8读取switch-case中跳转地址和后续内容
jmp-er6        = 21D38 | MOV SP, ER6 ; POP ER8 ; POP PC   // sp 设为 [er6]; pop er8
jumpe14-q8     = 12D34 | MOV SP, ER14 ; POP QR8 ; POP PC   // sp=er14,pop qr8
mem-sete4      = 16C68 | ST ER0, [ER2] ; MOV R2, #0 ; POP ER4 ; RT   // [ER2]=ER0 / 016C68   23 90              ST      ER0, [ER2] / 016C6A   00 02              MOV     R2, ＃0 / 016C6C   1E F4              POP     ER4 / 016C6E   1F FE              RT
randint        = 13960 | PUSH ER6 ; PUSH QR8 ; MOV ER14, SP ; ADD SP, #-14h   // [ER0],seed=RanInt([ER0],[ER2],seed=[D310]),[D310]
er0>er2?       = 0B61E | CMP ER0, ER2 ; BC GT, 0B626h ; MOV R0, #1 ; RT   // r0=(er0>er2)? 0:1
mem-set        = 1651A | ST R0, [ER2] ; MOV R0, #0 ; POP PC   // [er2]=r0 / r0=0
copy-word      = 16EDC | L ER4, [ER0] ; ST ER4, [ER2] ; ADD ER0, #2 ; ADD ER2, #2   // [er0]->[er2], length=r6*2 byte / pop qr0 / RT
er0isr0*r2+er4 = 14B12 | MUL ER0, R2 ; MOV ER2, ER0 ; ADD ER0, ER4 ; RT   // er0=r0*r2+er4 / RT
er0->er14      = 179BC | MOV ER14, ER0 ; POP XR0 ; POP PC   // 0179BC   05 FE              MOV     ER14, ER0 / 0179BE   2E F0              POP     XR0 / 0179C0   8E F2              POP     PC
swap           = 10F04 | L ER0, [ER10] ; L ER2, [ER12] ; ST ER0, [ER12] ; ST ER2, [ER10]   // 找到一个，是唯一的，以 POP PC 结尾： / 010F04  L   ER0, [ER10]     ; t0 = mem[ER10] / 010F06  L   ER2, [ER12]     ; t2 = mem[ER12] / 010F08  ST  ER0, [ER12]     ; mem[ER12] = t0 / 010F0A  ST  ER2, [ER10]     ; mem[ER10] = t2   → [ER10] 与 [ER12] 已交换 / 010F0C  ADD ER10, ＃2 / 010F0E  ADD ER12, ＃2 / 010F10  ADD R8, ＃255        ; R8-- / 010F12  BC  NE, 010F04h     ; 循环 R8 次 / 010F14  POP QR8 / 010F16  POP QR0 / 010F18  POP PC / - 位置：_disas.txt:30817（地址 0x010F04），结束于 0x010F18 的 POP PC / - 每次交换 2 字节，循环 R8 次；只需交换一对 [ERx]**/**[ERy] 时设 R8=1 / - 若需连续交换则每次迭代 ER10/ER12 各 +2 / 全程搜索了所有以 RT 或 POP PC 结尾的序列，仅此一处构成严格的「读A存B、读B存A」交换模式。
do-nothing     = 08300 | POP PC   // 什么都不做。(just POP PC)
int-off    = 092F8 | DI ; RT          // 关中断（防止 OS 显示任务把屏幕重画掉）
int-on     = 092F4 | EI ; RT          // 开中断
