# CROP 引导配置（launcher.conf）
# 值均为十六进制。实测机型：fx-991CN X（fx991cnxfVirtual，rom.bin）

# 链写入的 RAM 地址（左侧地址 / 程序储存地址）
# 链存放位置：必须避开机器自己的栈（实测栈在 E9xx~EBxx），EC00 已验证安全
left_addr     = EC00
# 右侧地址（RopIDE 的 rightStartAddress，本工具暂未使用）
right_addr    = D3C0
# 变量区起始地址（rgcc --data-base）
data_base     = D180
# launcher 写入位置：回放区（输入缓冲区 = 源）。
# 注意：写 0xD180（输入区 = 目的地）会被"按右"覆盖掉，实测无效。
launcher_addr = D248
# 输入长度/光标账本：只写内容不写它，按右不会导入（实测 D244..D247 = 07 有效）
len_field     = D244
len_value     = 7
# 触发按键序列
keys          = -> 然后 =

# launcher 字节模板（由 crop.launcher.launcher_bytes 生成）：
#   FD 24 <left_addr - 10h 小端> 8F 23 42
# 8F 23 42 → PC=0x238F、CSR=2；PC 按 2 字节对齐 → 实际执行 2:2238E
#   MOV SP,ER14 ; POP QR8 ; POP QR0 ; POP PC
# 即：ER14 ← <left_addr - 10h>（payload 里那 2 字节）→ SP = left_addr-10h
#     → 吃掉 16 字节 → POP PC 取 left_addr 处的链首槽。
# 实测：CasioEmuMsvc + fx991cnxfVirtual，断点命中 0x2238E，写入 D31C=[7,9] 正确。
